<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TinDog - Admin Dashboard</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon-transparent.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>

<body>
  <div data-component="../components/admin-header.html"></div>
  <div class="container-fluid">
    <div class="row">
      <div data-component="../components/admin-sidebar.html" class="col-md-3 col-lg-2 d-md-block p-0"></div>
      <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
        <div class="page-header gradient-background">
          <h1 class="h2">Dashboard</h1>
          <p class="mb-0">Welcome back, here is your performance overview.</p>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-xl-3 col-md-6">
            <a href="./users/index.html" class="kpi-card-link">
              <div class="kpi-card">
                <div class="d-flex align-items-center">
                  <div class="kpi-icon icon-bg-primary me-3">
                    <i class="bi bi-people-fill"></i>
                  </div>
                  <div>
                    <h5 class="kpi-title">Total Users</h5>
                    <h4 class="kpi-value mb-0" id="total-users-count">...</h4>
                  </div>
                </div>
              </div>
            </a>
          </div>
          <div class="col-xl-3 col-md-6">
            <a href="./analytics.html#revenue" class="kpi-card-link">
              <div class="kpi-card">
                <div class="d-flex align-items-center">
                  <div class="kpi-icon icon-bg-secondary me-3">
                    <i class="bi bi-cash-stack"></i>
                  </div>
                  <div>
                    <h5 class="kpi-title">Monthly Revenue</h5>
                    <h4 class="kpi-value mb-0" id="monthly-revenue">...</h4>
                  </div>
                </div>
              </div>
            </a>
          </div>
          <div class="col-xl-3 col-md-6">
            <a href="./reports.html" class="kpi-card-link">
              <div class="kpi-card">
                <div class="d-flex align-items-center">
                  <div class="kpi-icon icon-bg-accent me-3">
                    <i class="bi bi-flag-fill"></i>
                  </div>
                  <div>
                    <h5 class="kpi-title">Open Reports</h5>
                    <h4 class="kpi-value mb-0" id="open-reports-count">...</h4>
                  </div>
                </div>
              </div>
            </a>
          </div>
          <div class="col-xl-3 col-md-6">
            <div class="kpi-card">
              <div class="d-flex align-items-center">
                <div class="kpi-icon icon-bg-success me-3">
                  <i class="bi bi-shield-check"></i>
                </div>
                <div>
                  <h5 class="kpi-title">System Status</h5>
                  <h4 class="kpi-value text-success mb-0">Online</h4>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-12">
            <div class="activity-feed h-100">
              <h5 class="mb-3">Recent Activity</h5>
              <div id="activity-feed-container">
                <p class="text-muted small">No recent activity.</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/lib/data-service.js"></script>
  <script src="../assets/js/utils/toast-service.js"></script>
  <script src="../assets/js/utils/component-loader.js"></script>
  <script src="../assets/js/utils/theme-loader.js"></script>
  <script src="../assets/js/admin/dashboard-home.js"></script>
</body>

</html>
